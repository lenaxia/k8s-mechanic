name: OpenSSF Scorecard

on:
  schedule:
    # Weekly on Monday at 01:30 UTC
    - cron: '30 1 * * 1'
  push:
    branches: [main]

# Restrict default permissions; each job grants only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the GitHub Security tab.
      security-events: write
      # Required to publish results and retrieve a badge via the OIDC token.
      id-token: write
      # Needed to check out the repository.
      contents: read
      # Needed to read Actions workflow files.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF REST API for the public badge.
          # Set to false to keep results private.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif

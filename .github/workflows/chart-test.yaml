name: Chart Lint

on:
  push:
    paths:
      - "charts/**"
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Lint chart (strict)
        run: |
          helm lint charts/mechanic/ --strict \
            --set gitops.repo=org/repo \
            --set gitops.manifestRoot=kubernetes

      - name: Template render check
        run: |
          helm template mechanic charts/mechanic/ \
            --set gitops.repo=org/repo \
            --set gitops.manifestRoot=kubernetes
